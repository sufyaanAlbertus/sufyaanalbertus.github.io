<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Sunset timer + rising pressure">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(212,175,55,0.08)" stroke-width="1"/></pattern>
<radialGradient id="glow" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#D4AF37" stop-opacity="0.28"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
<linearGradient id="goldbtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DA7A"/><stop offset="1" stop-color="#C9971F"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8C65F"/></marker>
</defs>
<rect width="800" height="600" fill="#0A0804"/><rect width="800" height="600" fill="url(#g)"/><rect width="800" height="600" fill="url(#glow)"/>
<rect x="12" y="12" width="776" height="576" fill="none" stroke="rgba(212,175,55,0.35)"/>
<text x="36" y="52" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#E8C65F">BUZZ TOGETHER // PROCESS 03</text>
<text x="36" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" fill="#F2EEE3">Sunset timer + rising pressure</text>
<rect x="60" y="300" width="680" height="40" fill="rgba(212,175,55,0.15)" stroke="#E8C65F"/><rect x="604" y="300" width="136" height="40" fill="rgba(255,90,60,0.35)" stroke="#ff8a65"/><text x="60" y="286" text-anchor="start" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="0" fill="#E8C65F">2:30 START</text><text x="740" y="286" text-anchor="end" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="0" fill="#ff8a65">0:00</text><text x="604.0" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#ffb199">0:30 — timer turns red, sun sets</text><text x="604.0" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#ffb199">a new wasp every 25 s</text><line x1="200" y1="240" x2="200" y2="296" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><text x="200" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0" fill="#E8C65F">+5 s</text><line x1="330" y1="240" x2="330" y2="296" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><text x="330" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0" fill="#E8C65F">+5 s</text><line x1="450" y1="240" x2="450" y2="296" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><text x="450" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="0" fill="#E8C65F">+5 s</text><text x="325" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#DCD5C4">every delivery adds time</text><rect x="60" y="460" width="320" height="80" fill="rgba(212,175,55,0.08)" stroke="#E8C65F" stroke-width="1.5"/><text x="220.0" y="487.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0" fill="#E8C65F">DESIGN INTENT</text><text x="220.0" y="504.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#DCD5C4">early deliveries buy time</text><text x="220.0" y="522.1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#DCD5C4">for the risky sunflower runs</text><rect x="420" y="460" width="320" height="80" fill="rgba(212,175,55,0.08)" stroke="#E8C65F" stroke-width="1.5"/><text x="580.0" y="487.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" letter-spacing="0" fill="#E8C65F">ENDGAME</text><text x="580.0" y="504.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#DCD5C4">last 30 seconds get frantic:</text><text x="580.0" y="522.1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#DCD5C4">more wasps, less light</text><text x="764" y="572" text-anchor="end" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#A79E8A">TUNING</text></svg>