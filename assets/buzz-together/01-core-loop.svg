ight="90" fill="url(#goldbtn)" stroke="#E8C65F" stroke-width="1.5"/><text x="160.0" y="361.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0" fill="#0A0804">SWARM GROWS</text><text x="160.0" y="379.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" letter-spacing="0" fill="#0A0804">+1 worker bee</text><text x="160.0" y="398.79999999999995" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" letter-spacing="0" fill="#0A0804">= +1 pollen sac</text><line x1="260" y1="185" x2="536" y2="185" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><line x1="640" y1="230" x2="640" y2="326" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><line x1="540" y1="375" x2="264" y2="375" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><line x1="160" y1="330" x2="160" y2="234" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="470" width="300" height="86" fill="rgba(212,175,55,0.08)" stroke="#E8C65F" stroke-width="1.5"/><text x="400.0" y="499.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="0" fill="#E8C65F">WASP STING</text><text x="400.0" y="517.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" letter-spacing="0" fill="#DCD5C4">a bee dies in your place,</text><text x="400.0" y="536.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" letter-spacing="0" fill="#DCD5C4">you drop half your pollen</text><line x1="400" y1="420" x2="400" y2="466" stroke="#E8C65F" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 5"/><text x="660" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" letter-spacing="0" fill="#A79E8A">no swarm left →</text><text x="660" 